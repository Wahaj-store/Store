name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Playwright 1.56.1 does not provide browser dependencies for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wahaj
          POSTGRES_PASSWORD: wahaj_ci_only
          POSTGRES_DB: wahaj_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wahaj -d wahaj_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      PRISMA_DATABASE_URL: postgresql://wahaj:wahaj_ci_only@localhost:5432/wahaj_ci?schema=public
      PRISMA_DIRECT_URL: postgresql://wahaj:wahaj_ci_only@localhost:5432/wahaj_ci?schema=public
      AUTH_SECRET: ci-only-auth-secret-do-not-use-outside-tests
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-do-not-use-outside-tests
      CRON_SECRET: ci-only-cron-secret-do-not-use-outside-tests
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-only-password-not-for-production
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      BLOB_READ_WRITE_TOKEN: ''
      BLOB_PUBLIC_READ_WRITE_TOKEN: ''

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply migrations to temporary PostgreSQL
        run: npm run db:migrate:deploy

      - name: Check production dependencies
        run: npm audit --omit=dev

      - name: Check all dependencies, including development tools
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
